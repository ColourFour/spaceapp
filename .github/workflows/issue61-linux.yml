name: Verify reviewed issue 61 patch on Linux

'on':
  push:
    branches:
      - validation/issue61-linux

permissions:
  contents: read

concurrency:
  group: issue61-linux-validation
  cancel-in-progress: false

jobs:
  reviewed-patch:
    name: Full quality checks on the reviewed patch
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out the reviewed source
        id: source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ColourFour/spaceapp
          ref: ad2e355be13ce3e37cd4b918d9859220a857b197
          persist-credentials: false

      - name: Confirm the reviewed commit
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = ad2e355be13ce3e37cd4b918d9859220a857b197

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Install Linux test tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep ffmpeg

      - name: Install locked dependencies
        id: dependencies
        run: npm ci

      - name: Full static checks
        id: static_checks
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run check

      - name: Real Temporal tracing and replay integration cases
        if: ${{ !cancelled() && steps.static_checks.outcome == 'success' }}
        run: npm test -w @space/worker -- tests/workflow-tracing.integration.test.ts

      - name: Full public test suite
        id: public_tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run test:public

      - name: Workspace tests if the root public suite fails
        if: ${{ !cancelled() && steps.static_checks.outcome == 'success' && steps.public_tests.outcome == 'failure' }}
        run: npm test --workspaces --if-present

      - name: Full build
        id: build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run build

      - name: Launcher package dry run
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run pack:dry-run -w run-spaceapp

      - name: Confirm tracked source remained unchanged
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: git diff --exit-code HEAD
